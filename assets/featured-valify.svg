  <text x="56" y="114" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#C7D6E9">Chaque créneau est validé par un acompte ou une empreinte bancaire. Tunnel sans compte client,</text>
  <text x="56" y="134" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#C7D6E9">politiques de pénalité configurables, litiges tracés, multi-tenant strict.</text>
