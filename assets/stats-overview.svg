<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="300" viewBox="0 0 1500 300" role="img" aria-label="Indicateurs vérifiés du portfolio">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
    <g>
      <rect x="30" y="26" width="232" height="238" rx="18" fill="#0E1D36" stroke="#1E3A5F" stroke-width="1.4"/>
      <rect x="30" y="26" width="232" height="4" rx="2" fill="url(#bar)" opacity=".9"/>
      <text x="146" y="128" text-anchor="middle" font-size="52" font-weight="800" fill="url(#num)">20</text>
      <text x="146" y="164" text-anchor="middle" font-size="16.5" font-weight="700" fill="#DBEAFE">Projets sélectionnés</text>
      <text x="146" y="188" text-anchor="middle" font-size="13" fill="#94A3B8">sur ~100 dépôts audités</text>
      <text x="146" y="230" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">sélection exigeante</text>
      <text x="146" y="246" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">aucun dépôt supprimé</text>
    </g>
    <g>
      <rect x="277" y="26" width="232" height="238" rx="18" fill="#0E1D36" stroke="#1E3A5F" stroke-width="1.4"/>
      <rect x="277" y="26" width="232" height="4" rx="2" fill="url(#bar)" opacity=".9"/>
      <text x="393" y="128" text-anchor="middle" font-size="52" font-weight="800" fill="url(#num)">5</text>
      <text x="393" y="164" text-anchor="middle" font-size="16.5" font-weight="700" fill="#DBEAFE">Réalisations majeures</text>
      <text x="393" y="188" text-anchor="middle" font-size="13" fill="#94A3B8">fiches complètes auditées</text>
      <text x="393" y="230" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">HESYD-ONE · Valify · OmniAd</text>
      <text x="393" y="246" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">AIDIP · EDIA</text>
    </g>
    <g>
      <rect x="524" y="26" width="232" height="238" rx="18" fill="#0E1D36" stroke="#1E3A5F" stroke-width="1.4"/>
      <rect x="524" y="26" width="232" height="4" rx="2" fill="url(#bar)" opacity=".9"/>
      <text x="640" y="128" text-anchor="middle" font-size="52" font-weight="800" fill="url(#num)">3</text>
      <text x="640" y="164" text-anchor="middle" font-size="16.5" font-weight="700" fill="#DBEAFE">Applications en ligne</text>
      <text x="640" y="188" text-anchor="middle" font-size="13" fill="#94A3B8">vérifiées HTTP 200</text>
      <text x="640" y="236" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">+ 2 apps déployées à accès protégé</text>
    </g>
    <g>
      <rect x="771" y="26" width="232" height="238" rx="18" fill="#0E1D36" stroke="#1E3A5F" stroke-width="1.4"/>
      <rect x="771" y="26" width="232" height="4" rx="2" fill="url(#bar)" opacity=".9"/>
      <text x="887" y="128" text-anchor="middle" font-size="52" font-weight="800" fill="url(#num)">1 500+</text>
      <text x="887" y="164" text-anchor="middle" font-size="16.5" font-weight="700" fill="#DBEAFE">Tests automatisés</text>
      <text x="887" y="188" text-anchor="middle" font-size="13" fill="#94A3B8">3 suites CI vérifiées</text>
      <text x="887" y="230" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">EDIA 196 · AlphaEngine 214</text>
      <text x="887" y="246" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">Postula 1100</text>
    </g>
    <g>
      <rect x="1018" y="26" width="232" height="238" rx="18" fill="#0E1D36" stroke="#1E3A5F" stroke-width="1.4"/>
      <rect x="1018" y="26" width="232" height="4" rx="2" fill="url(#bar)" opacity=".9"/>
      <text x="1134" y="128" text-anchor="middle" font-size="52" font-weight="800" fill="url(#num)">1,6 M+</text>
      <text x="1134" y="164" text-anchor="middle" font-size="16.5" font-weight="700" fill="#DBEAFE">Lignes de données</text>
      <text x="1134" y="188" text-anchor="middle" font-size="13" fill="#94A3B8">ingérées et trackées</text>
      <text x="1134" y="230" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">Olist 565 328 lignes</text>
      <text x="1134" y="246" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">UCI Retail 1 067 371 lignes</text>
    </g>
    <g>
      <rect x="1265" y="26" width="232" height="238" rx="18" fill="#0E1D36" stroke="#1E3A5F" stroke-width="1.4"/>
      <rect x="1265" y="26" width="232" height="4" rx="2" fill="url(#bar)" opacity=".9"/>
      <text x="1381" y="128" text-anchor="middle" font-size="52" font-weight="800" fill="url(#num)">9</text>
      <text x="1381" y="164" text-anchor="middle" font-size="16.5" font-weight="700" fill="#DBEAFE">Produits SaaS complets</text>
      <text x="1381" y="188" text-anchor="middle" font-size="13" fill="#94A3B8">multi-tenant, auth, billing</text>
      <text x="1381" y="230" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">code confidentiel</text>
      <text x="1381" y="246" text-anchor="middle" font-size="11.5" fill="#64748B" letter-spacing=".4">présentation autorisée</text>
